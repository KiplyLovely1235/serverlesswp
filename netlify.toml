[functions]
  directory = "api"
  # Static assets (JS, images, fonts) are served from the CDN via wp-public, so they are
  # excluded from the function bundle to stay under the 250 MB function size limit.
  # JS files that PHP reads at runtime (e.g. wp-includes/js/tinymce, Elementor's
  # assets/lib font-awesome mapping.js) are intentionally kept.
  included_files = [
    "wp/**",
    "node_modules/serverlesswp/wordpress-assets/**",
    "node_modules/serverlesswp/php-files/**",
    "!wp/wp-includes/js/dist/**/*.js",
    "!wp/wp-admin/js/**/*.js",
    "!wp/wp-content/themes/**/*.js",
    "!wp/wp-content/plugins/elementor/assets/js/**/*.js",
    "!wp/wp-content/plugins/essential-addons-for-elementor-lite/assets/**/*.js",
    "!wp/**/*.map",
    "!wp/**/*.png",
    "!wp/**/*.jpg",
    "!wp/**/*.jpeg",
    "!wp/**/*.gif",
    "!wp/**/*.webp",
    "!wp/**/*.ico",
    "!wp/**/*.woff",
    "!wp/**/*.woff2",
    "!wp/**/*.otf",
    "!wp/**/*:Zone.Identifier",
  ]
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/index/:splat"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "max-age=864000, s-maxage=864000"
[build]
  command = "rm -rf .git && npm ci && mkdir -p wp-public && find wp -type f \\( -name '*.css' -o -name '*.js' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' -o -name '*.svg' -o -name '*.woff' -o -name '*.woff2' -o -name '*.ico' -o -name '*.otf' -o -name '*.webp' \\) -exec cp --parents {} wp-public/ \\;"
  publish = "wp-public/wp"
